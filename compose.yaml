services:
  db:
    image: postgres:17-alpine
    container_name: integration-lab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: integration_lab
      POSTGRES_USER: integration_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration_user -d integration_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: integration-lab-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://integration_user:local_dev_password@db:5432/integration_lab
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: integration-lab-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
